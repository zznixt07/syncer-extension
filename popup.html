<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>POPUP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="popup.js" type="module"></script>
    <link rel="stylesheet" href="./index.css">
    <style>

    </style>
</head>

<body>
    <div class="input-container">
        <h3>
            <label for="server-address">
                Server Address
            </label>
        </h3>
        <input type="text" id="server-address" minlength="1" value="http://127.0.0.1:3000">
    </div>
    <div class="input-container">
        <h3>
            <label for="new-room-name">
                Room Name
            </label>
        </h3>
        <input type="text" id="new-room-name" minlength="1" list="rooms" value="chill-music-24/7">
        <p id="room-user-count" class="room-user-count"></p>
        <datalist id="rooms">

        </datalist>
    </div>
    <div class="flex">
        <div class="pad flex">
            <button id="create-room" class="btn pushable">
                <!-- <span class="shadow"></span>
                <span class="edge"></span>
                <span class="front"> -->
                Create Room
                <!-- </span> -->
            </button>
            <!-- <input type="text" id="join-room-name" name="join-room-name" value="shailesh"> -->
            <button class="btn pushable" id="join-room">
                Join Room
            </button>
            <button class="btn pushable" id="leave-room">
                Leave Room
            </button>
        </div>
        <div>
            <!-- <button class="btn" id="change-room-stream">Change Stream</button> -->
        </div>
    </div>
    <section id="host-media" class="host-media" hidden>
        <h3>Host media</h3>
        <p class="host-media-instruction">Open this media manually, then Syncer will follow play, pause, and seek.</p>
        <dl>
            <div><dt>Service</dt><dd id="host-media-service"></dd></div>
            <div><dt>Title</dt><dd id="host-media-title"></dd></div>
            <div id="host-media-artist-row"><dt>Artist/channel</dt><dd id="host-media-artist"></dd></div>
            <div id="host-media-duration-row"><dt>Duration</dt><dd id="host-media-duration"></dd></div>
        </dl>
        <button id="copy-host-media-title" class="btn host-media-copy" type="button">Copy title</button>
    </section>
    <div>
        <div>
            <span>Rooms</span>
            <button class="btn pushable" id="list-rooms">List Rooms</button>
        </div>
        <pre id="rooms-list"></pre>
    </div>
    <button class="btn pushable" id="recheck-video">Recheck Video</button>
</body>

</html>
